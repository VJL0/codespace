[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic[tz]>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "resend>=2.49.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15.0",
]

[tool.alembic]
script_location = "%(here)s/migrations"
# Date-prefixed so revision files sort chronologically.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
timezone = "UTC"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-ra"]
strict = true
required_plugins = ["anyio", "pytest-cov"]
anyio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@abstractmethod"]
