services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 128mb

    ports:
      - "127.0.0.1:5432:5432"

    environment:
      POSTGRES_DB: codespace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codespace"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: